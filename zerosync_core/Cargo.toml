[package]
name = "zerosync_core"
version = "1.0.0"
edition = "2021"
authors = ["Cancellls <dev@cancellls.com>"]
description = "Universal Rust core engine for ZeroSync-DB with C-FFI exports for Flutter, Python, Node.js, and Swift."

[lib]
name = "zerosync_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.10.3"
sha2 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }
hex = "0.4"

[dev-dependencies]
