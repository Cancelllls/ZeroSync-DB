  crypto: ^3.0.3
  encrypt: ^5.0.3
  web_socket_channel: ^3.0.1
  path: ^1.9.0
  uuid: ^4.5.1
  meta: ^1.15.0

dev_dependencies:
  test: ^1.25.0
  lints: ^3.0.0
